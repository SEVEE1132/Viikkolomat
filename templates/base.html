<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="language" content="fi">

    <title>{% block title %}Viikkolomat{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header class="site-header">

    <div class="header-inner">

        <a class="brand" href="/">
            Viikkolomat<span>.</span>
        </a>

        <button class="menu-btn"
                type="button"
                aria-expanded="false"
                aria-controls="menuDropdown">
            Valikko
        </button>

        <nav class="menu-dropdown"
             id="menuDropdown"
             aria-label="Päänavigaatio">

            <a href="/">Etusivu</a>
            <a href="/#cottages">Vuokrattavat viikot</a>
            <a href="/lisaa-mokki">Lisää oma lomaviikko</a>
            <a href="/#about">Tietoa</a>
            <a href="/#contact">Yhteystiedot</a>

        </nav>

    </div>

</header>

<main>

    {% block content %}
    {% endblock %}

</main>

<footer>
    <p>&copy; 2026 SH Palvelut · Viikkolomat</p>
</footer>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
